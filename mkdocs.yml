site_name: HiCExplorer
site_description: >-
  HiCExplorer, a tool suite to process, normalize,
  analyze and visualize Hi-C and capture Hi-C data
site_author: Joachim Wolff
copyright: GPL-3.0 License

# repo_url and edit_uri stay unset until the documentation has its public repository. Then set:
#   repo_url: https://github.com/<org>/<repo>
#   repo_name: <org>/<repo>
#   edit_uri: edit/<default-branch>/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

