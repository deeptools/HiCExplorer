pr:
  autoCancel: true

jobs:
- job: Linux
  displayName: 'Linux Conda Build & Test'
  timeoutInMinutes: 0
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
    matrix:
      Python310:
        python.version: '3.10'
      Python311:
        python.version: '3.11'
      Python312:
        python.version: '3.12'

  steps:
  - bash: |
      echo "##vso[task.prependpath]$CONDA/bin"
    displayName: 'Add Conda to PATH'

  - bash: |
      set -e
      conda config --set always_yes yes --set changeps1 no
      conda create -n hicexplorer -c conda-forge -c bioconda python=$(python.version) --file requirements.txt
      conda install -n hicexplorer -c conda-forge -c bioconda pytest flake8 pytest-xdist pytest-forked nose pathlib configparser
      conda run -n hicexplorer pip install . --no-deps
    displayName: 'Install Dependencies'

  - bash: |
      set -e
      conda run -n hicexplorer flake8 . --exclude=.venv,.build,planemo_test_env,build --ignore=E501,F401,F403,E402,F999,F405,E712,W504
    displayName: 'Linting'

  - bash: |
      set -e
      conda run -n hicexplorer pytest hicexplorer/test/test_pytest_collected_items.py --doctest-modules --capture=sys
      conda run -n hicexplorer pytest hicexplorer --doctest-modules --ignore=hicexplorer/test/
    displayName: 'Doc Test and Number of Cases'

  - bash: |
      set -e
      conda run -n hicexplorer pytest hicexplorer/test/general/ --doctest-modules --capture=sys -n 4 --ignore=hicexplorer/test/general/test_hicTADClassifier.py --ignore=hicexplorer/test/general/test_hicTrainTADClassifier.py
    displayName: 'Pytest'

  - bash: |
      set -e
      conda run -n hicexplorer pytest hicexplorer/test/general/test_hicTADClassifier.py
      conda run -n hicexplorer pytest hicexplorer/test/general/test_hicTrainTADClassifier.py
    displayName: 'Pytest TAD Classifier'

- job: OSX
  displayName: 'macOS Conda Build & Test'
  timeoutInMinutes: 0
  pool:
    vmImage: 'macOS-latest'
  strategy:
    matrix:
      Python310:
        pythonVersion: '3.10'
      Python311:
        pythonVersion: '3.11'
      Python312:
        pythonVersion: '3.12'

  steps:
  - task: Bash@3
    displayName: 'Install Miniconda'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh -o miniconda.sh
        bash miniconda.sh -b -p $HOME/miniconda3
        echo "##vso[task.prependpath]$HOME/miniconda3/bin"

  - task: Bash@3
    displayName: 'Create & Populate Conda Env'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        conda config --set always_yes yes --set changeps1 no
        # Create environment with Python version from matrix
        conda create -n hicexplorer -c conda-forge -c bioconda \
          python=${{ matrix.pythonVersion }} --file requirements.txt
        conda install -n hicexplorer -c conda-forge -c bioconda \
          pytest flake8 pytest-xdist pytest-forked nose pathlib configparser
        conda run -n hicexplorer pip install . --no-deps

  - task: Bash@3
    displayName: 'Linting'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        conda run -n hicexplorer flake8 . \
          --exclude=.venv,.build,planemo_test_env,build \
          --ignore=E501,F401,F403,E402,F999,F405,E712,W504

  - task: Bash@3
    displayName: 'Doc Test and Number of Cases'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        conda run -n hicexplorer pytest hicexplorer/test/test_pytest_collected_items.py --doctest-modules --capture=sys
        conda run -n hicexplorer pytest hicexplorer --doctest-modules --ignore=hicexplorer/test/

  - task: Bash@3
    displayName: 'Pytest'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        conda run -n hicexplorer pytest hicexplorer/test/general/ --doctest-modules --capture=sys -n 4 \
          --ignore=hicexplorer/test/general/test_hicTADClassifier.py \
          --ignore=hicexplorer/test/general/test_hicTrainTADClassifier.py

  - task: Bash@3
    displayName: 'Pytest TAD Classifier'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        conda run -n hicexplorer pytest hicexplorer/test/general/test_hicTADClassifier.py
        conda run -n hicexplorer pytest hicexplorer/test/general/test_hicTrainTADClassifier.py
