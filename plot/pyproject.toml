[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hicexplorer-plot"
version = "0.1.0"
description = "Drawing layer of the HiCExplorer v4 C++ plotting tools: matplotlib figures from the data the C++ binaries compute"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8",
    "numpy",
    # hicPlotAverageRegions rotates its image with scipy.ndimage.rotate, an
    # interpolation that is part of the figure.
    "scipy",
    # hicQC.html is pandas Styler.to_html through Jinja2, and the QC charts
    # are pandas plotting calls.
    "pandas",
    "jinja2",
    # hicPlotMatrix reads its bigwig tracks while drawing and transliterates
    # --title, as the reference does.
    "pyBigWig",
    "unidecode",
]

[project.scripts]
hicPlotDistVsCounts = "hicexplorer_plot.tools:hicPlotDistVsCounts"
hicPlotViewpoint = "hicexplorer_plot.tools:hicPlotViewpoint"
hicPlotAverageRegions = "hicexplorer_plot.tools:hicPlotAverageRegions"
chicPlotViewpoint = "hicexplorer_plot.tools:chicPlotViewpoint"
hicCorrelate = "hicexplorer_plot.tools:hicCorrelate"
hicPrepareQCreport = "hicexplorer_plot.tools:hicPrepareQCreport"
hicQC = "hicexplorer_plot.tools:hicQC"
hicPlotMatrix = "hicexplorer_plot.tools:hicPlotMatrix"

[tool.setuptools]
packages = ["hicexplorer_plot"]

[tool.setuptools.package-data]
hicexplorer_plot = ["qc_template.html"]
