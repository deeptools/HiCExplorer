name: C++ (HiCExplorer v4)

on:
  push:
    branches: [version4-cpp]
    paths: ['cpp/**', 'plot/**', 'pyproject.toml', 'hicexplorer/_cpp.py', 'hicexplorer/test/test_data/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', 'plot/**', 'pyproject.toml', 'hicexplorer/_cpp.py', 'hicexplorer/test/test_data/**', '.github/workflows/cpp.yml']
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-24.04}
          - {name: linux-arm64, os: ubuntu-24.04-arm}
          - {name: macos-arm64, os: macos-14}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false
          activate-environment: hicx
          channels: conda-forge,bioconda

      - name: Install native dependencies
        run: mamba install --yes -n hicx cmake ninja compilers hdf5 blosc zlib htslib libopenblas liblapack graphviz python=3.12 pybind11=2.13.6 libboost-headers=1.85 libbigwig=0.4.8 eigen=3.4 doctest=2.4.11

      - name: Configure
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure --parallel 4

      - name: Build and smoke-test the Python package
        run: |
          pip install scikit-build-core pathspec
          CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$CONDA_PREFIX" \
            pip wheel . --no-deps --no-build-isolation -w wheelhouse
          pip install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          # the command is the C++ executable itself, not a Python console script
          test "$(head -c 2 "$(command -v hicInfo)")" != '#!'
          hicInfo --version
          hicInfo -m "$GITHUB_WORKSPACE/hicexplorer/test/test_data/small_test_matrix.h5"
          python -c "from hicexplorer import _cpp; print(_cpp.find_executable('hicInfo'))"
          # the public Python API is C++ through the extension in the wheel
          python -c "from hicexplorer._hicx import utilities as u; print(u.genomicRegion('chr1:1,000-2,000'))"

  windows:
    name: ${{ matrix.name }} (experimental)
    runs-on: ${{ matrix.os }}
    # The sources use POSIX headers (unistd.h, sys/wait.h, dlfcn.h). These jobs
    # report whether the MSYS2 toolchains build them and never fail the run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x86_64, os: windows-2022, msystem: CLANG64, prefix: mingw-w64-clang-x86_64}
          - {name: windows-arm64, os: windows-11-arm, msystem: CLANGARM64, prefix: mingw-w64-clang-aarch64}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.prefix }}-toolchain
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-hdf5
            ${{ matrix.prefix }}-blosc
            ${{ matrix.prefix }}-zlib
            ${{ matrix.prefix }}-openblas
            ${{ matrix.prefix }}-htslib

      - name: Configure
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX"

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure --parallel 4
