name: C++ (HiCExplorer v4)

on:
  push:
    branches: [version4-cpp]
    paths: ['cpp/**', 'plot/**', 'pyproject.toml', 'hicexplorer/_cpp.py', 'hicexplorer/test/test_data/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', 'plot/**', 'pyproject.toml', 'hicexplorer/_cpp.py', 'hicexplorer/test/test_data/**', '.github/workflows/cpp.yml']
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conda:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-24.04}
          - {name: linux-arm64, os: ubuntu-24.04-arm}
          - {name: macos-15-arm64, os: macos-15}
          - {name: macos-latest-arm64, os: macos-latest}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: false
          activate-environment: hicx
          channels: conda-forge,bioconda
          conda-remove-defaults: "true"

      - name: Install native dependencies
        run: |
          # conda-forge's 2.x compiler packages give macOS a bare clang 21.1.0 under
          # the htslib<1.22 pin, which links with Xcode's ld and fails on conda's
          # libLTO; the 1.x packages keep conda's clang wrapper and ld64.
          case "$(uname)" in Darwin) cxx='cxx-compiler=1.*' ;; *) cxx=compilers ;; esac
          mamba install --yes -n hicx cmake ninja "$cxx" 'hdf5>=1.14.3,<1.15' 'blosc>=1.21.6,<1.22' zlib 'htslib>=1.21,<1.22' 'libopenblas=0.3.28' liblapack graphviz python=3.12 numpy=1.26 matplotlib-base=3.8.4 pybind11=2.13.6 libboost-headers=1.85 libbigwig=0.4.8 eigen=3.4 doctest=2.4.11

      - name: Configure
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure --parallel 4

      - name: Build and smoke-test the Python package
        run: |
          pip install scikit-build-core pathspec
          CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$CONDA_PREFIX" \
            pip wheel . --no-deps --no-build-isolation -w wheelhouse
          pip install --no-deps wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          # the command is the C++ executable itself, not a Python console script
          test "$(head -c 2 "$(command -v hicInfo)")" != '#!'
          hicInfo --version
          hicInfo -m "$GITHUB_WORKSPACE/hicexplorer/test/test_data/small_test_matrix.h5"
          python -c "from hicexplorer import _cpp; print(_cpp.find_executable('hicInfo'))"
          # the public Python API is C++ through the extension in the wheel
          python -c "from hicexplorer._hicx import utilities as u; print(u.genomicRegion('chr1:1,000-2,000'))"
