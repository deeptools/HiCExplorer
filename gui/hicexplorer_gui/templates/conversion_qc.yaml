template:
  name: conversion_qc
  title: Conversion and QC
  description: >-
    Two matrices converted to cool at one resolution (for example from .hic),
    their summary, the correlation between them and their distance decay
    curves.
  parameters:
    - name: matrixA
      kind: file
      description: first matrix, in the input format below
    - name: matrixB
      kind: file
      description: second matrix, same format
    - name: inputFormat
      kind: value
      default: hic
      description: input format (hic, cool, h5, homer, hicpro, 2D-text)
    - name: resolution
      kind: value
      default: 500000
      description: resolution in bp read from the inputs; the converter appends it to the output names
    - name: method
      kind: value
      default: pearson
      description: correlation method, pearson or spearman
  unavailable:
    - tool: HiCRep
      purpose: stratum-adjusted correlation coefficient of the two matrices
      reason: not implemented, PLAN 9.10
workflow:
  version: 1
  name: conversion_qc
  threads: 2
  steps:
    - id: convert_a
      tool: hicConvertFormat
      description: first matrix to cool
      args:
        matrices: ["@{matrixA}"]
        inputFormat: "@{inputFormat}"
        outputFormat: cool
        resolutions: ["@{resolution}"]
        outFileName: convert/a.cool
      outputs: {matrix: "convert/a_@{resolution}.cool"}
    - id: convert_b
      tool: hicConvertFormat
      description: second matrix to cool
      args:
        matrices: ["@{matrixB}"]
        inputFormat: "@{inputFormat}"
        outputFormat: cool
        resolutions: ["@{resolution}"]
        outFileName: convert/b.cool
      outputs: {matrix: "convert/b_@{resolution}.cool"}
    - id: info
      tool: hicInfo
      description: matrix summary
      args:
        matrices: ["${steps.convert_a.outputs.matrix}", "${steps.convert_b.outputs.matrix}"]
        outFileName: "${outputs.info}"
      outputs: {info: info/info.txt}
    - id: correlate
      tool: hicCorrelate
      description: correlation between the matrices
      args:
        matrices: ["${steps.convert_a.outputs.matrix}", "${steps.convert_b.outputs.matrix}"]
        labels: [A, B]
        method: "@{method}"
        log1p: true
        outFileNameHeatmap: "${outputs.heatmap}"
        outFileNameScatter: "${outputs.scatter}"
      outputs: {heatmap: correlate/heatmap.png, scatter: correlate/scatter.png}
    - id: decay
      tool: hicPlotDistVsCounts
      description: distance decay curves
      args:
        matrices: ["${steps.convert_a.outputs.matrix}", "${steps.convert_b.outputs.matrix}"]
        labels: [A, B]
        plotFile: "${outputs.plot}"
        outFileData: "${outputs.data}"
      outputs: {plot: decay/decay.png, data: decay/decay.txt}
