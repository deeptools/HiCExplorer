template:
  name: capture_hic
  title: Capture Hi-C
  description: >-
    Capture Hi-C viewpoints: the quality control of the reference points, the
    background model of the accepted ones, the viewpoints with their p-values
    and plots, the significant interactions per sample, their statistics
    aggregated over two samples, the differential test between the samples,
    and the export of the differential results as text.
  parameters:
    - name: matrices
      kind: files
      description: capture Hi-C matrices (cool), one per sample; the differential test needs two
    - name: referencePoints
      kind: file
      description: BED file of the reference points (captured regions)
    - name: sparsity
      kind: value
      default: 0.05
      description: reference points with a sparsity at or below this are rejected
    - name: range
      kind: value
      default: [200000, 200000]
      description: bp upstream and downstream of a reference point
    - name: fixateRange
      kind: value
      default: 500000
      description: the background model uses the values up to this distance
    - name: plotGene
      kind: value
      default: Eya1
      description: the reference point (gene) whose viewpoints are plotted
    - name: xFoldBackground
      kind: value
      default: 1.5
      description: x-fold over the background model that preselects candidate peaks
    - name: pValue
      kind: value
      default: 0.2
      description: p-value threshold for the merged peaks of a viewpoint
    - name: alpha
      kind: value
      default: 0.05
      description: significance level of the differential test
    - name: statisticTest
      kind: value
      default: fisher
      description: differential test, fisher or chi2
    - name: correction
      kind: value
      default: fdr
      description: >-
        multiple testing correction of the significant interactions and of the
        differential test, none, fdr or bonferroni (a C++ option, PLAN 9.7;
        none gives the Python tools' results)
workflow:
  version: 1
  name: capture_hic
  threads: 2
  steps:
    - id: quality
      threads: 1
      tool: chicQualityControl
      description: reference point quality control
      args:
        matrices: ["@{matrices}"]
        referencePoints: "@{referencePoints}"
        sparsity: "@{sparsity}"
        outFileName: "${outputs.accepted}"
        outFileNameHistogram: "${outputs.histogram}"
        outFileNameSparsity: "${outputs.sparsity}"
      outputs: {accepted: quality/referencepoints.bed, histogram: quality/histogram.png,
                sparsity: quality/sparsity.png}
    - id: background
      threads: 1
      tool: chicViewpointBackgroundModel
      description: background model
      args:
        matrices: ["@{matrices}"]
        referencePoints: "${steps.quality.outputs.accepted}"
        fixateRange: "@{fixateRange}"
        outFileName: "${outputs.model}"
      outputs: {model: background/background.txt}
    - id: viewpoints
      threads: 1
      tool: chicViewpoint
      description: viewpoints
      args:
        matrices: ["@{matrices}"]
        referencePoints: "${steps.quality.outputs.accepted}"
        backgroundModelFile: "${steps.background.outputs.model}"
        range: "@{range}"
        fixateRange: "@{fixateRange}"
        outFileName: "${outputs.interactions}"
      outputs: {interactions: viewpoints/interactions.hdf5}
    - id: plots
      threads: 1
      tool: chicPlotViewpoint
      description: viewpoint plots
      args:
        interactionFile: "${steps.viewpoints.outputs.interactions}"
        range: "@{range}"
        combinationMode: oneGene
        combinationName: "@{plotGene}"
        outFileName: "${outputs.plots}"
      outputs: {plots: plots/viewpoints.tar.gz}
    - id: significant
      threads: 1
      tool: chicSignificantInteractions
      description: significant interactions per sample, and the target regions per pair of samples
      args:
        interactionFile: "${steps.viewpoints.outputs.interactions}"
        backgroundModelFile: "${steps.background.outputs.model}"
        range: "@{range}"
        fixateRange: "@{fixateRange}"
        xFoldBackground: "@{xFoldBackground}"
        pValue: "@{pValue}"
        combinationMode: dual
        correctForMultipleTesting: "@{correction}"
        outFileNameSignificant: "${outputs.significant}"
        outFileNameTarget: "${outputs.target}"
      outputs: {significant: significant/significant.hdf5, target: significant/target.hdf5}
    - id: aggregate
      threads: 1
      tool: chicAggregateStatistic
      description: the interactions of both samples aggregated over the target regions
      args:
        interactionFile: "${steps.viewpoints.outputs.interactions}"
        targetFile: "${steps.significant.outputs.target}"
        outFileName: "${outputs.aggregate}"
      outputs: {aggregate: aggregate/aggregate.hdf5}
    - id: differential
      threads: 1
      tool: chicDifferentialTest
      description: differential interactions between the two samples
      args:
        aggregatedFile: "${steps.aggregate.outputs.aggregate}"
        alpha: "@{alpha}"
        statisticTest: "@{statisticTest}"
        correctForMultipleTesting: "@{correction}"
        outFileName: "${outputs.differential}"
      outputs: {differential: differential/differential.hdf5}
    - id: export
      threads: 1
      tool: chicExportData
      description: the differential results as text, accepted, rejected and all per reference point
      args:
        file: "${steps.differential.outputs.differential}"
        outputMode: all
        outFileName: "${outputs.archive}"
      outputs: {archive: export/differential_export.tar.gz}
