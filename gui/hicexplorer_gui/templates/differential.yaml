template:
  name: differential
  title: Differential TADs
  description: >-
    Two conditions, each given as one or more replicate matrices of the same
    bins: replicates are summed per condition, both sums are corrected, TADs
    are called on the target condition, and hicDifferentialTAD tests every TAD
    with the union of both conditions' invalid bins masked in both
    (--sharedMask) and Benjamini-Hochberg adjusted p-values
    (--correctForMultipleTesting fdr).
  parameters:
    - name: targetReplicates
      kind: files
      description: replicate matrices of the target condition (cool or h5, same bins)
    - name: controlReplicates
      kind: files
      description: replicate matrices of the control condition
    - name: correctionMethod
      kind: value
      default: KR
      description: matrix balancing of both conditions, KR or ICE
    - name: pValue
      kind: value
      default: 0.05
      description: threshold on the adjusted p-values
    - name: mode
      kind: value
      default: intra-TAD
      description: the tested regions (intra-TAD, left-inter-TAD, right-inter-TAD or all)
    - name: modeReject
      kind: value
      default: one
      description: reject when one or all of the tests reject
  unavailable:
    - tool: differential loops
      purpose: loops that differ between the conditions
      reason: not implemented yet, the count-based differential engine of PLAN 9.7
    - tool: differential compartments
      purpose: compartments that differ between the conditions
      reason: not implemented yet, the count-based differential engine of PLAN 9.7
workflow:
  version: 1
  name: differential
  threads: 2
  steps:
    - id: sum_target
      tool: hicSumMatrices
      description: target replicates summed
      args:
        matrices: ["@{targetReplicates}"]
        outFileName: "${outputs.matrix}"
      outputs: {matrix: sum/target.cool}
    - id: sum_control
      tool: hicSumMatrices
      description: control replicates summed
      args:
        matrices: ["@{controlReplicates}"]
        outFileName: "${outputs.matrix}"
      outputs: {matrix: sum/control.cool}
    - id: correct_target
      tool: hicCorrectMatrix
      subcommand: correct
      description: target balanced
      args:
        matrix: "${steps.sum_target.outputs.matrix}"
        correctionMethod: "@{correctionMethod}"
        outFileName: "${outputs.matrix}"
      outputs: {matrix: correct/target.cool}
    - id: correct_control
      tool: hicCorrectMatrix
      subcommand: correct
      description: control balanced
      args:
        matrix: "${steps.sum_control.outputs.matrix}"
        correctionMethod: "@{correctionMethod}"
        outFileName: "${outputs.matrix}"
      outputs: {matrix: correct/control.cool}
    - id: tads
      tool: hicFindTADs
      description: TADs of the target condition
      threads: 2
      args:
        matrix: "${steps.correct_target.outputs.matrix}"
        correctForMultipleTesting: fdr
        outPrefix: "${outputs.t}"
      outputs: {t: tads/target}
    - id: differential
      tool: hicDifferentialTAD
      description: differential TADs
      threads: 2
      args:
        targetMatrix: "${steps.correct_target.outputs.matrix}"
        controlMatrix: "${steps.correct_control.outputs.matrix}"
        tadDomains: "${steps.tads.outputs.t}_domains.bed"
        outFileNamePrefix: "${outputs.diff}"
        pValue: "@{pValue}"
        mode: "@{mode}"
        modeReject: "@{modeReject}"
        sharedMask: true
        correctForMultipleTesting: fdr
      outputs: {diff: differential/diff}
